<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="8" fill="url(#bg)"/>
  <!-- Inverted triangle (nabla shape) -->
  <path d="M8 10 L40 10 L24 42 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Horizontal dividers inside triangle -->
  <line x1="12" y1="18" x2="36" y2="18" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="16" y1="26" x2="32" y2="26" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Gear (top-left section) -->
  <circle cx="18" cy="14" r="2.5" fill="none" stroke="#ffffff" stroke-width="1"/>
  <circle cx="18" cy="14" r="1" fill="#ffffff"/>
  <!-- Gear teeth (simplified) -->
  <line x1="18" y1="11" x2="18" y2="11.5" stroke="#ffffff" stroke-width="1"/>
  <line x1="18" y1="16.5" x2="18" y2="17" stroke="#ffffff" stroke-width="1"/>
  <line x1="15" y1="14" x2="15.5" y2="14" stroke="#ffffff" stroke-width="1"/>
  <line x1="20.5" y1="14" x2="21" y2="14" stroke="#ffffff" stroke-width="1"/>
  <!-- Tool/caliper (top-right section) -->
  <line x1="30" y1="12" x2="30" y2="17" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="28" y1="12" x2="32" y2="12" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="29" y1="15" x2="31" y2="17" stroke="#ffffff" stroke-width="1"/>
  <!-- Truss (bottom section) -->
  <polyline points="18,28 21,32 24,28 27,32 30,28" fill="none" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
  <line x1="18" y1="28" x2="30" y2="28" stroke="#ffffff" stroke-width="1"/>
  <line x1="19" y1="32" x2="29" y2="32" stroke="#ffffff" stroke-width="0.8"/>
</svg>
