<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Operador Nabla brand logo -->
  <!-- Inverted triangle with engineering symbols -->
  
  <!-- Main inverted triangle -->
  <path d="M20 20 L180 20 L100 190 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Inner border -->
  <path d="M30 28 L170 28 L100 180 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity="0.3"/>
  
  <!-- Horizontal dividers -->
  <line x1="38" y1="60" x2="162" y2="60" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="58" y1="110" x2="142" y2="110" stroke="#ffffff" stroke-width="2.5"/>
  
  <!-- Top-left: Gear -->
  <g transform="translate(75, 40)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    <!-- Gear teeth -->
    <rect x="-2" y="-18" width="4" height="5" fill="#ffffff" rx="1"/>
    <rect x="-2" y="13" width="4" height="5" fill="#ffffff" rx="1"/>
    <rect x="-18" y="-2" width="5" height="4" fill="#ffffff" rx="1"/>
    <rect x="13" y="-2" width="5" height="4" fill="#ffffff" rx="1"/>
    <rect x="9" y="-13" width="4" height="4" fill="#ffffff" rx="1" transform="rotate(45, 11, -11)"/>
    <rect x="-13" y="-13" width="4" height="4" fill="#ffffff" rx="1" transform="rotate(-45, -11, -11)"/>
    <rect x="9" y="9" width="4" height="4" fill="#ffffff" rx="1" transform="rotate(-45, 11, 11)"/>
    <rect x="-13" y="9" width="4" height="4" fill="#ffffff" rx="1" transform="rotate(45, -11, 11)"/>
  </g>
  
  <!-- Top-right: Caliper/Tool -->
  <g transform="translate(130, 35)">
    <line x1="0" y1="-10" x2="0" y2="20" stroke="#ffffff" stroke-width="3"/>
    <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#ffffff" stroke-width="3"/>
    <line x1="-8" y1="-10" x2="-8" y2="5" stroke="#ffffff" stroke-width="2"/>
    <line x1="8" y1="-10" x2="8" y2="5" stroke="#ffffff" stroke-width="2"/>
    <line x1="-3" y1="12" x2="5" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="3" y1="12" x2="-2" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom: Truss structure -->
  <g transform="translate(100, 125)">
    <!-- Top chord -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Bottom chord -->
    <line x1="-22" y1="20" x2="22" y2="20" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Diagonals (Warren truss pattern) -->
    <line x1="-30" y1="0" x2="-18" y2="20" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="-18" y1="20" x2="-10" y2="0" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="-10" y1="0" x2="-2" y2="20" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="-2" y1="20" x2="10" y2="0" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="10" y1="0" x2="18" y2="20" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="18" y1="20" x2="30" y2="0" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Nodes -->
    <circle cx="-30" cy="0" r="2" fill="#ffffff"/>
    <circle cx="-10" cy="0" r="2" fill="#ffffff"/>
    <circle cx="10" cy="0" r="2" fill="#ffffff"/>
    <circle cx="30" cy="0" r="2" fill="#ffffff"/>
    <circle cx="-18" cy="20" r="2" fill="#ffffff"/>
    <circle cx="-2" cy="20" r="2" fill="#ffffff"/>
    <circle cx="18" cy="20" r="2" fill="#ffffff"/>
  </g>
  
  <!-- Text: OPERADOR NABLA -->
  <text x="100" y="215" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="3">OPERADOR NABLA</text>
</svg>
