<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Operador Nabla — brand logo matching reference -->
  
  <!-- Main inverted triangle — thick bold stroke -->
  <path d="M24 16 L176 16 L100 184 Z" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  
  <!-- Horizontal divider — upper (separates gear/tool from truss) -->
  <line x1="42" y1="56" x2="158" y2="56" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Horizontal divider — lower (above truss section) -->
  <line x1="62" y1="105" x2="138" y2="105" stroke="#ffffff" stroke-width="4"/>
  
  <!-- TOP-LEFT SECTION: Gear -->
  <g transform="translate(72, 36)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
    <!-- Teeth -->
    <rect x="-2.5" y="-16" width="5" height="5" fill="#ffffff" rx="0.5"/>
    <rect x="-2.5" y="11" width="5" height="5" fill="#ffffff" rx="0.5"/>
    <rect x="-16" y="-2.5" width="5" height="5" fill="#ffffff" rx="0.5"/>
    <rect x="11" y="-2.5" width="5" height="5" fill="#ffffff" rx="0.5"/>
    <rect x="7" y="-12" width="5" height="5" fill="#ffffff" rx="0.5" transform="rotate(45, 9.5, -9.5)"/>
    <rect x="-12" y="-12" width="5" height="5" fill="#ffffff" rx="0.5" transform="rotate(-45, -9.5, -9.5)"/>
    <rect x="7" y="7" width="5" height="5" fill="#ffffff" rx="0.5" transform="rotate(-45, 9.5, 9.5)"/>
    <rect x="-12" y="7" width="5" height="5" fill="#ffffff" rx="0.5" transform="rotate(45, -9.5, 9.5)"/>
  </g>
  
  <!-- TOP-RIGHT SECTION: Caliper / Engineering tool -->
  <g transform="translate(130, 30)">
    <!-- Vertical bar -->
    <rect x="-2.5" y="-8" width="5" height="30" fill="#ffffff" rx="1"/>
    <!-- Horizontal top bar -->
    <rect x="-14" y="-10" width="28" height="5" fill="#ffffff" rx="1"/>
    <!-- Left jaw -->
    <rect x="-12" y="-5" width="4" height="14" fill="#ffffff" rx="1"/>
    <!-- Right jaw -->
    <rect x="8" y="-5" width="4" height="14" fill="#ffffff" rx="1"/>
    <!-- Point/tip at bottom -->
    <polygon points="-3,22 3,22 0,30" fill="#ffffff"/>
  </g>
  
  <!-- BOTTOM SECTION: Warren truss bridge -->
  <g transform="translate(100, 120)">
    <!-- Top chord -->
    <rect x="-30" y="-2" width="60" height="4" fill="#ffffff" rx="1"/>
    <!-- Bottom chord -->
    <rect x="-22" y="22" width="44" height="4" fill="#ffffff" rx="1"/>
    <!-- Diagonal members (W pattern) -->
    <polygon points="-30,2 -26,2 -18,22 -22,22" fill="#ffffff"/>
    <polygon points="-18,22 -14,22 -8,2 -12,2" fill="#ffffff"/>
    <polygon points="-8,2 -4,2 4,22 0,22" fill="#ffffff"/>
    <polygon points="4,22 8,22 14,2 10,2" fill="#ffffff"/>
    <polygon points="14,2 18,2 26,22 22,22" fill="#ffffff"/>
    <polygon points="26,22 30,22 30,2 26,2" fill="#ffffff" opacity="0"/>
  </g>
</svg>
