<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nl1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="nl2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#nl2)" stroke="url(#nl1)" stroke-width="2"/>
  <!-- Nabla symbol -->
  <text x="32" y="42" text-anchor="middle" font-family="serif" font-size="32" font-weight="bold" fill="url(#nl1)">∇</text>
  <!-- Orbiting dots -->
  <circle cx="32" cy="6" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="56" cy="38" r="1.5" fill="#818cf8" opacity="0.7"/>
  <circle cx="12" cy="44" r="1.5" fill="#a855f7" opacity="0.7"/>
  <!-- Company name -->
  <text x="32" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6" font-weight="600" fill="#c7d2fe" letter-spacing="1">NABLA</text>
</svg>
